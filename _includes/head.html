<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {%- if page.lang %}
  {%- for l in site.data.languages %}
  <link rel="alternate" hreflang="{{ l.code }}" href="{{ l.url | absolute_url }}">
  {%- endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
  {%- endif %}
  <link rel="icon" href="{{ '/docs/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/docs/assets/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/docs/assets/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="{{ '/assets/fonts/schibsted-grotesk-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}">
  {% feed_meta %}
</head>
