{%- assign home_url = '/' %}
{%- for l in site.data.languages %}{% if l.code == lang %}{% assign home_url = l.url %}{% endif %}{% endfor %}
<nav class="post-nav" aria-label="{{ t.post.all_posts }}">
  <a class="prev" href="{{ '/archive.html' | relative_url }}">{{ t.post.all_posts }}</a>
  <a class="next" href="{{ home_url | relative_url }}">{{ t.post.home }}</a>
</nav>
