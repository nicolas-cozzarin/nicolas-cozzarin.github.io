<nav class="post-nav" aria-label="More posts">
  {%- if page.previous.url %}
  <a class="prev" href="{{ page.previous.url | relative_url }}"><span class="post-nav-label">Previous post</span>{{ page.previous.title }}</a>
  {%- else %}
  <span></span>
  {%- endif %}
  {%- if page.next.url %}
  <a class="next" href="{{ page.next.url | relative_url }}"><span class="post-nav-label">Next post</span>{{ page.next.title }}</a>
  {%- else %}
  <a class="next" href="{{ '/' | relative_url }}"><span class="post-nav-label">Back to</span>Nicolas Cozzarin's homepage</a>
  {%- endif %}
</nav>
