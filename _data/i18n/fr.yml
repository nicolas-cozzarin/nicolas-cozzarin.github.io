about:
  - "Je suis Product Owner avec 10 ans d'expérience en développement backend, QA, analyse fonctionnelle et gestion de produit. Ces dernières années, je me suis spécialisé dans les produits IA et data."
  - "À Genève, j'ai travaillé chez Union of Financial Corners, une société de transfert d'argent et de change, où j'ai été Product Owner de trois produits, dont l'achat de cryptomonnaies en agence et une plateforme de change en ligne. Pour mon stage de fin d'études, j'ai développé un système NLP pour l'organisme qui enquête sur les fautes des forces de sécurité à Córdoba, en Argentine. Il retire les données personnelles de chaque plainte et propose une catégorie, et c'est un procureur qui prend la décision finale."
  - "Je me concentre aujourd'hui sur la conformité de l'IA, l'éthique et l'alignement des modèles. Je veux aider les organisations à intégrer l'IA et l'automatisation là où elles améliorent vraiment le travail, et pas seulement les entreprises : les associations, les ONG et les institutions publiques ont souvent moins de moyens pour le faire et beaucoup à y gagner. J'ai commencé à le faire en tant que bénévole, par exemple en concevant le cadre IA du hackathon Hack the Fork."
  - "En parallèle de mon parcours professionnel, je me suis beaucoup investi dans le bénévolat pour le bien-être et les droits des animaux, et j'explore aujourd'hui l'impact potentiel de l'intelligence artificielle sur la situation des animaux, un sujet crucial qui reste largement absent du débat. Cela inclut l'examen de l'utilisation actuelle et potentielle de l'IA dans les élevages industriels et, à l'inverse, dans la réduction de la souffrance des animaux sauvages, ainsi que la manière dont la réduction des attitudes spécistes dans les systèmes d'IA de pointe peut avoir un impact présent et futur. Enfin, je m'intéresse à la façon dont les outils d'IA pourraient renforcer nos actions de plaidoyer pour les animaux."

work:
  - title: "Vente de cryptomonnaies en agence"
    context: "Union of Financial Corners, Genève"
    text: "Les clients paient en espèces au guichet et reçoivent du Bitcoin ou de l'Ethereum sur leur propre wallet, ou vendent de la crypto contre des espèces. J'ai piloté le lancement : les besoins, le choix du partenaire crypto suisse, le backlog avec les développeurs externes, les tests, les procédures en agence et la formation du personnel."
    result: "En service dans toutes les agences de Genève, Lausanne, Berne et Zurich. Les clients reviennent régulièrement, nous avions tous les documents demandés lors des audits, et le service est en cours d'extension à des bornes partenaires dans toute la Suisse."
    links:
      - label: "Lire l'article"
        url: "/2026/09/28/vendre-du-bitcoin-au-guichet.html"
  - title: "Tri anonymisé des plaintes pour le contrôle de la police"
    context: "Gouvernement de Córdoba, Argentine, 2025–2026"
    text: "Un pipeline NLP qui retire les noms, les numéros d'identité et les adresses des plaintes de citoyens avant que quiconque ne les lise, puis propose l'une des huit catégories officielles de l'organisme. Un procureur valide ou corrige chaque proposition."
    result: "Sur un jeu de test aveugle de 2 189 plaintes, un rappel de 77 % sur les violences institutionnelles et un F1 de 0,72 sur les violences de genre. Tout tourne sur le matériel de l'organisme."
    stack: "Python, PyTorch, BETO (BERT espagnol), spaCy, Microsoft Presidio"
    note: "Le code n'est pas public, car le système traite des données gouvernementales."
    links:
      - label: "Lire l'article (en anglais)"
        url: "/2026/07/10/anonymized-triage-security-forces.html"
  - title: "Justice Inequality Simulator"
    context: "Cours de modèles génératifs profonds, Hochschule Furtwangen, 2025"
    text: "Une façon de tester si un modèle qui prédit des décisions de justice est biaisé. Je modifie un seul détail sensible dans la description de l'affaire, comme le genre ou l'origine, et je mesure de combien la prédiction change."
    result: "Précision de 0,78 et ROC-AUC de 0,84 sur le jeu de test. Dans plusieurs cas, remplacer un mot sensible a déplacé la probabilité prédite de 0,10 à 0,25."
    stack: "Python, Legal-BERT, PyTorch, scikit-learn"
    links:
      - label: "Lire l'article (en anglais)"
        url: "/2025/07/06/justice-inequality-simulator.html"
      - label: "Ouvrir le notebook"
        url: "https://colab.research.google.com/drive/1vRHQOD1OUOzySDsNfvsINIWz_LFxucYV?usp=sharing"

