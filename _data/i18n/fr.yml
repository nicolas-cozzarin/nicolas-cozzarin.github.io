research:
  intro: "Les sujets sur lesquels je veux continuer à travailler, en poste comme en master."
  items:
    - title: "L'IA et les animaux"
      text: "Comment l'IA est utilisée aujourd'hui dans l'élevage industriel, comment elle pourrait aider à réduire la souffrance des animaux sauvages, et comment les attitudes spécistes des systèmes d'IA de pointe peuvent peser sur les animaux, aujourd'hui et demain. Je m'intéresse aussi à la façon dont les outils d'IA peuvent renforcer le plaidoyer pour les animaux. C'est un sujet important, encore très peu discuté."
    - title: "L'IA dans les institutions publiques"
      text: "Je veux comprendre comment les tribunaux, les régulateurs et les organes de contrôle peuvent utiliser l'IA sans en faire une nouvelle boîte noire. À Córdoba, cela voulait dire une personne qui valide chaque décision, un journal d'audit et des données qui restent sur le matériel du gouvernement. L'AI Act européen demande en grande partie la même chose pour les systèmes à haut risque."
    - title: "Les biais dans les modèles d'IA"
      text: "Dans le Justice Inequality Simulator, j'ai testé les biais en changeant un seul détail d'une affaire et en regardant si la prédiction changeait. Ce type de test m'intéresse parce que n'importe qui peut l'appliquer à un système qu'il ne contrôle pas, y compris des régulateurs et des journalistes."

