about:
  - "J'ai 10 ans d'expérience en développement backend, QA, analyse fonctionnelle et gestion de produit. Chez Union of Financial Corners à Genève, j'ai été Product Owner de trois produits clients dans une activité réglementée de transfert d'argent."
  - "Pendant ma licence en Intelligence Artificielle et Robotique, j'ai piloté et développé un système NLP qui anonymise et trie les plaintes visant les forces de sécurité, pour l'organe de contrôle de la province de Córdoba, en Argentine. Il fonctionne entièrement sur site et chaque décision est validée par une personne."
  - "Je recherche des postes en produit IA, produit technique et gouvernance de l'IA, où l'IA responsable fait partie du produit dès le départ."

work:
  - title: "Tri anonymisé des plaintes pour le contrôle de la police"
    context: "Gouvernement de Córdoba, Argentine, 2025–2026"
    text: "Un pipeline NLP qui retire les données personnelles des plaintes de citoyens avant toute lecture, puis propose l'une des huit catégories officielles, qu'un procureur valide ou corrige."
    result: "Sur un jeu de test aveugle de 2 189 plaintes : rappel de 77 % sur les violences institutionnelles et F1 de 0,72 sur les violences de genre. Fonctionne entièrement sur site."
    stack: "Python, PyTorch, BETO (BERT espagnol), spaCy, Microsoft Presidio"
    note: "Le code n'est pas public, car le système traite des données gouvernementales."
    links:
      - label: "Lire l'article (en anglais)"
        url: "/2026/07/10/anonymized-triage-security-forces.html"
  - title: "Justice Inequality Simulator"
    context: "Cours de modèles génératifs profonds, Hochschule Furtwangen, 2025"
    text: "Teste si un modèle de prédiction de décisions de justice est biaisé : on modifie un seul détail sensible d'une affaire, comme le genre ou l'origine, et on mesure de combien la prédiction change."
    result: "Précision de 0,78 et ROC-AUC de 0,84 sur le jeu de test. Le remplacement de mots sensibles a déplacé les probabilités prédites de 0,10 à 0,25 dans plusieurs cas."
    stack: "Python, Legal-BERT, PyTorch, scikit-learn"
    links:
      - label: "Lire l'article (en anglais)"
        url: "/2025/07/06/justice-inequality-simulator.html"
      - label: "Ouvrir le notebook"
        url: "https://colab.research.google.com/drive/1vRHQOD1OUOzySDsNfvsINIWz_LFxucYV?usp=sharing"

