about:
  - "Soy Product Owner, con 10 años de experiencia en desarrollo backend, QA, análisis funcional y gestión de producto. En los últimos años me especialicé en productos de IA y datos."
  - "En Ginebra trabajé en Union of Financial Corners, una empresa de envío de dinero y cambio de divisas, donde fui Product Owner de tres productos, entre ellos la compra de criptomonedas en las sucursales y una plataforma de cambio online. Para la práctica profesional de mi carrera desarrollé un sistema de NLP para el organismo que investiga las faltas de las fuerzas de seguridad en Córdoba, Argentina. El sistema quita los datos personales de cada denuncia y sugiere una categoría, y la decisión final la toma un fiscal."
  - "Hoy mi foco está en el cumplimiento normativo de la IA, la ética y el alineamiento de los modelos. Quiero ayudar a las organizaciones a integrar IA y automatización donde realmente mejoran el trabajo, y no solo a las empresas: las asociaciones, las ONG y las instituciones públicas muchas veces tienen menos recursos para hacerlo y mucho para ganar. Ya empecé a hacerlo como voluntario, por ejemplo diseñando el marco de IA de la hackathon Hack the Fork."
  - "Además de mi trabajo profesional, he participado activamente como voluntario en causas de bienestar y derechos animales, y actualmente estoy explorando el impacto potencial de la inteligencia artificial en la situación de los animales, un tema crucial que sigue siendo poco discutido. Esto incluye analizar el uso actual y potencial de la IA en la ganadería industrial y, por el contrario, en la reducción del sufrimiento de los animales silvestres, así como la manera en que reducir las actitudes especistas en los sistemas de IA de vanguardia puede tener un impacto en el presente y en el futuro. Finalmente, considero de qué manera las herramientas de IA podrían potenciar nuestros esfuerzos de activismo por los animales."

work:
  - title: "Controles del Reglamento europeo de IA en el pipeline de despliegue"
    context: "Trabajo final de grado, Universidad Empresarial Siglo 21, 2026"
    text: "Un validador pensado para correr como una etapa de un pipeline de GitLab CI. En cada versión nueva de un modelo de crédito, mide si el modelo aprueba a hombres y mujeres en tasas distintas y verifica cinco controles del Reglamento europeo de IA. Si alguno falla, el despliegue se frena y el reporte indica la regla y el artículo."
    result: "Prototipo funcionando. En una primera ejecución, la versión 1 de un modelo de crédito de prueba cumplió las cinco reglas y la versión 2 quedó bloqueada por la regla de equidad (diferencia de paridad demográfica de 0,15, umbral de 0,10). La evaluación frente a la revisión manual se hace en noviembre de 2026."
    stack: "Python, RDF, SHACL, GraphDB, Fairlearn, GitLab CI, Streamlit, Docker"
    note: "La consultora y el banco son un caso modelado, no clientes reales."
    links:
      - label: "Leer el artículo"
        url: "/2026/10/25/verificar-el-reglamento-de-ia-en-el-pipeline.html"
      - label: "Ver las pantallas del prototipo"
        url: "https://nicolas-cozzarin.github.io/validador-prototipo/"
  - title: "Venta de criptomonedas en sucursales"
    context: "Union of Financial Corners, Ginebra"
    text: "Los clientes pagan en efectivo en la ventanilla y reciben Bitcoin o Ethereum en su propia wallet, o venden cripto a cambio de efectivo. Lideré el lanzamiento: los requerimientos, la elección del socio cripto suizo, el backlog con los desarrolladores externos, las pruebas, los procedimientos de sucursal y la capacitación del personal."
    result: "Funciona en todas las sucursales de Ginebra, Lausana, Berna y Zúrich. Los clientes vuelven seguido, teníamos todos los documentos que pidieron en las auditorías, y el servicio se está extendiendo a quioscos de socios en toda Suiza."
    links:
      - label: "Leer el artículo"
        url: "/2026/09/28/vender-bitcoin-en-ventanilla.html"
  - title: "Clasificación anonimizada de denuncias para el control policial"
    context: "Institución pública provincial de seguridad, Córdoba, Argentina, 2025 a 2026"
    text: "Un pipeline de NLP que quita nombres, números de documento y direcciones de las denuncias ciudadanas antes de que alguien las lea, y después sugiere una de las ocho categorías oficiales del organismo. Un fiscal aprueba o corrige cada sugerencia."
    result: "Sobre un conjunto de prueba ciego de 2.189 denuncias, 77 % de recall en violencia institucional y un F1 de 0,72 en violencia de género. Todo corre en el hardware propio del organismo."
    stack: "Python, PyTorch, BETO (BERT en español), spaCy, Microsoft Presidio"
    note: "El código no es público porque el sistema trabaja con datos del gobierno."
    links:
      - label: "Leer el artículo (en inglés)"
        url: "/2026/07/10/anonymized-triage-security-forces.html"
  - title: "Justice Inequality Simulator"
    context: "Deep Generative Models Project, Hochschule Furtwangen University (HFU), 2025"
    text: "Una forma de probar si un modelo que predice resultados judiciales tiene sesgos. Cambio un solo dato sensible en la descripción del caso, como el género o el origen étnico, y mido cuánto se mueve la predicción."
    result: "En varios casos, cambiar una palabra sensible movió la probabilidad predicha entre 0,10 y 0,25. Exactitud de 0,78 en el conjunto de prueba, probablemente optimista: el artículo explica los límites de la evaluación."
    stack: "Python, Legal-BERT, PyTorch, scikit-learn"
    links:
      - label: "Leer el artículo (en inglés)"
        url: "/2025/07/06/justice-inequality-simulator.html"
      - label: "Abrir el notebook"
        url: "https://colab.research.google.com/drive/1vRHQOD1OUOzySDsNfvsINIWz_LFxucYV?usp=sharing"

