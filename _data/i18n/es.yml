research:
  intro: "Los temas en los que quiero seguir trabajando, en mi trabajo y en un máster."
  items:
    - title: "La IA y los animales"
      text: "Cómo se usa hoy la IA en la ganadería industrial, cómo podría ayudar a reducir el sufrimiento de los animales silvestres y cómo las actitudes especistas de los sistemas de IA de vanguardia pueden afectar a los animales, hoy y en el futuro. También me interesa cómo las herramientas de IA pueden potenciar el activismo por los animales. Es un tema importante que todavía casi no se discute."
    - title: "La IA en las instituciones públicas"
      text: "Quiero entender cómo tribunales, reguladores y organismos de control pueden usar IA sin que se convierta en una nueva caja negra. En Córdoba eso significó que una persona revise cada decisión, un registro de auditoría y que los datos se queden en el hardware del gobierno. La Ley de IA de la UE pide en gran parte lo mismo para los sistemas de alto riesgo."
    - title: "Sesgos en los modelos de IA"
      text: "En el Justice Inequality Simulator probé los sesgos cambiando un solo dato de un caso y viendo si la predicción cambiaba. Me interesa este tipo de prueba porque cualquiera puede aplicarla a un sistema que no controla, incluidos reguladores y periodistas."

