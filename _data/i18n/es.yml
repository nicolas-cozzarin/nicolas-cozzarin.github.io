research:
  intro: "Las preguntas en las que quiero seguir trabajando, tanto en mi trabajo como en un máster."
  items:
    - title: "La IA dentro de las instituciones públicas"
      text: "Cómo tribunales, reguladores y organismos de control pueden usar IA sin crear nuevas cajas negras: revisión humana, trazabilidad, soberanía de los datos y lo que la Ley de IA de la UE exige en la práctica a los sistemas de alto riesgo."
    - title: "Medir sesgos caso por caso"
      text: "Pruebas contrafácticas que cambian un solo dato sensible y muestran si la decisión se mueve. Reguladores y periodistas pueden aplicarlas a sistemas que no controlan."
    - title: "La IA y los animales"
      text: "Cómo se usa la IA en la ganadería industrial, cómo podría ayudar a reducir el sufrimiento de los animales silvestres y cómo los sesgos especistas de los modelos de vanguardia podrían afectar a los animales."

