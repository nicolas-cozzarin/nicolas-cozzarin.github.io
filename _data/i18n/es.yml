about:
  - "Tengo 10 años de experiencia en desarrollo backend, QA, análisis funcional y gestión de producto. En Union of Financial Corners, en Ginebra, fui Product Owner de tres productos para clientes en un negocio regulado de envío de dinero."
  - "Durante mi Licenciatura en Inteligencia Artificial y Robótica, lideré y desarrollé un sistema de NLP que anonimiza y clasifica denuncias por conductas indebidas para el organismo de control de las fuerzas de seguridad de la Provincia de Córdoba, Argentina. Funciona 100 % on-premise y una persona revisa cada decisión."
  - "Busco puestos de producto de IA, producto técnico y gobernanza de la IA, donde la IA responsable forme parte del producto desde el inicio."

work:
  - title: "Clasificación anonimizada de denuncias para el control policial"
    context: "Gobierno de Córdoba, Argentina, 2025–2026"
    text: "Un pipeline de NLP que elimina los datos personales de las denuncias ciudadanas antes de que alguien las lea y luego sugiere una de las ocho categorías oficiales, que un fiscal aprueba o corrige."
    result: "Sobre un conjunto de prueba ciego de 2.189 denuncias: 77 % de recall en violencia institucional y un F1 de 0,72 en violencia de género. Funciona 100 % on-premise."
    stack: "Python, PyTorch, BETO (BERT en español), spaCy, Microsoft Presidio"
    note: "El código no es público porque el sistema procesa datos del gobierno."
    links:
      - label: "Leer el artículo (en inglés)"
        url: "/2026/07/10/anonymized-triage-security-forces.html"
  - title: "Justice Inequality Simulator"
    context: "Curso de Modelos Generativos Profundos, Hochschule Furtwangen, 2025"
    text: "Evalúa si un modelo que predice resultados judiciales tiene sesgos: cambia un solo dato sensible de un caso, como el género o el origen étnico, y mide cuánto se mueve la predicción."
    result: "Exactitud de 0,78 y ROC-AUC de 0,84 en el conjunto de prueba. Cambiar palabras sensibles movió las probabilidades predichas entre 0,10 y 0,25 en varios casos."
    stack: "Python, Legal-BERT, PyTorch, scikit-learn"
    links:
      - label: "Leer el artículo (en inglés)"
        url: "/2025/07/06/justice-inequality-simulator.html"
      - label: "Abrir el notebook"
        url: "https://colab.research.google.com/drive/1vRHQOD1OUOzySDsNfvsINIWz_LFxucYV?usp=sharing"

