about:
  - "I have 10 years of experience across backend development, QA, functional analysis and product ownership. At Union of Financial Corners in Geneva, I was product owner for three customer-facing products in a regulated money-transfer business."
  - "During my degree in Artificial Intelligence and Robotics, I led and built an NLP system that anonymises and triages misconduct complaints for the police oversight body of the Province of Córdoba, Argentina. It runs fully on-premise, and a person reviews every decision."
  - "I'm looking for AI product, technical product and AI governance roles where responsible AI is part of the product from the start."

work:
  - title: "Anonymised complaint triage for police oversight"
    context: "Government of Córdoba, Argentina, 2025–2026"
    text: "An NLP pipeline that removes personal data from citizen complaints before anyone reads them, then suggests one of eight official categories for a prosecutor to approve or override."
    result: "On a blind test set of 2,189 complaints: 77% recall on institutional violence and an F1 score of 0.72 on gender-based violence. Runs fully on-premise."
    stack: "Python, PyTorch, BETO (Spanish BERT), spaCy, Microsoft Presidio"
    note: "The code isn't public because the system runs on government data."
    links:
      - label: "Read the write-up"
        url: "/2026/07/10/anonymized-triage-security-forces.html"
  - title: "Justice Inequality Simulator"
    context: "Deep Generative Models course, Hochschule Furtwangen, 2025"
    text: "Tests whether a court-outcome prediction model is biased by changing one sensitive detail in a case description, such as gender or ethnicity, and measuring how far the prediction moves."
    result: "Test accuracy 0.78 and ROC-AUC 0.84. Swapping sensitive words shifted predicted probabilities by 0.10 to 0.25 in several cases."
    stack: "Python, Legal-BERT, PyTorch, scikit-learn"
    links:
      - label: "Read the write-up"
        url: "/2025/07/06/justice-inequality-simulator.html"
      - label: "Open the notebook"
        url: "https://colab.research.google.com/drive/1vRHQOD1OUOzySDsNfvsINIWz_LFxucYV?usp=sharing"

