about:
  - "I'm a Product Owner with 10 years of experience in backend development, QA, functional analysis and product management. In the last few years I have focused on AI and data products."
  - "In Geneva I worked at Union of Financial Corners, a money transfer and currency exchange company, where I was product owner for three products, among them crypto purchase in the branches and an online exchange platform. For my degree internship I built an NLP system for the office that investigates police misconduct in Córdoba, Argentina. It removes personal data from each complaint and suggests a category, and a prosecutor makes the final decision."
  - "My current focus is AI compliance, AI ethics and alignment. I want to help organisations use AI and automation where it really makes their work better, and not only companies: associations, NGOs and public institutions often have fewer resources to do it and a lot to gain. I have started doing this as a volunteer, for example by designing the AI framework for the Hack the Fork hackathon."
  - "Alongside my professional work, I have volunteered extensively in animal welfare and animal rights, and I am now exploring the potential impact of artificial intelligence on the situation of animals, a crucial topic that remains largely undiscussed. This includes examining the present and potential use of AI in factory farming and, conversely, in reducing wild animal suffering, as well as how reducing speciesist attitudes in frontier AI systems could shape outcomes for animals now and in the future. Finally, I consider how AI tools could help boost our efforts in animal advocacy."

work:
  - title: "EU AI Act checks in the deployment pipeline"
    context: "Final project, Universidad Empresarial Siglo 21, 2026"
    text: "A validator built to run as a step of a GitLab CI pipeline. For each new version of a credit model, it measures whether the model approves men and women at different rates and checks five controls of the EU AI Act. If one fails, the deployment is blocked and the report gives the rule and the article."
    result: "Working prototype. In a first run, version 1 of a test credit model passed the five rules and version 2 was blocked by the fairness rule (demographic parity difference of 0.15, limit 0.10). The evaluation against manual review takes place in November 2026."
    stack: "Python, RDF, SHACL, GraphDB, Fairlearn, GitLab CI, Streamlit, Docker"
    note: "The consultancy and the bank are a modelled case, not real clients."
    links:
      - label: "Read the write-up"
        url: "/2026/10/25/eu-ai-act-checks-in-the-deployment-pipeline.html"
      - label: "See the prototype screens"
        url: "https://nicolas-cozzarin.github.io/validador-prototipo/"
  - title: "Crypto sales in Swiss branches"
    context: "Union of Financial Corners, Geneva"
    text: "Clients pay cash at the counter and receive Bitcoin or Ethereum in their own wallet, or sell crypto for cash. I led the launch: the requirements, the choice of the Swiss crypto partner, the backlog with the external developers, the testing, the branch procedures and the staff training."
    result: "Live in all branches in Geneva, Lausanne, Bern and Zurich. Clients come back regularly, we had every document the auditors asked for, and the service is being extended to partner kiosks across Switzerland."
    links:
      - label: "Read the write-up"
        url: "/2026/09/28/selling-bitcoin-over-the-counter.html"
  - title: "Anonymised complaint triage for police oversight"
    context: "Provincial public security institution, Córdoba, Argentina, 2025 to 2026"
    text: "An NLP pipeline that removes names, ID numbers and addresses from citizen complaints before anyone reads them, and then suggests one of the office's eight official categories. A prosecutor approves or changes each suggestion."
    result: "On a blind test set of 2,189 complaints, 77% recall on institutional violence and an F1 score of 0.72 on gender-based violence. Everything runs on the office's own hardware."
    stack: "Python, PyTorch, BETO (Spanish BERT), spaCy, Microsoft Presidio"
    note: "The code is not public because the system works with government data."
    links:
      - label: "Read the write-up"
        url: "/2026/07/10/anonymized-triage-security-forces.html"
  - title: "Justice Inequality Simulator"
    context: "Deep Generative Models Project, Hochschule Furtwangen University (HFU), 2025"
    text: "A way to test if a model that predicts court outcomes is biased. I change one sensitive detail in the case description, like gender or ethnicity, and measure how much the prediction moves."
    result: "In several cases, swapping a sensitive word moved the predicted probability by 0.10 to 0.25. Test accuracy of 0.78, probably optimistic: the write-up explains the limits of the evaluation."
    stack: "Python, Legal-BERT, PyTorch, scikit-learn"
    links:
      - label: "Read the write-up"
        url: "/2025/07/06/justice-inequality-simulator.html"
      - label: "Open the notebook"
        url: "https://colab.research.google.com/drive/1vRHQOD1OUOzySDsNfvsINIWz_LFxucYV?usp=sharing"

