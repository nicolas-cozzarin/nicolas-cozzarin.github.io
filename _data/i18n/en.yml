research:
  intro: "These are the topics I want to keep working on, at work and in a master's."
  items:
    - title: "AI and animals"
      text: "How AI is used today in factory farming, how it could help reduce wild animal suffering, and how speciesist attitudes in frontier AI systems could affect animals now and in the future. I'm also interested in how AI tools can help animal advocacy. It is an important topic that is still barely discussed."
    - title: "AI in public institutions"
      text: "I want to understand how courts, regulators and oversight bodies can use AI without it becoming a new black box. In Córdoba that meant a person reviewing every decision, an audit log and keeping the data on government hardware. The EU AI Act asks for many of the same things for high-risk systems."
    - title: "Bias in AI models"
      text: "In the Justice Inequality Simulator I tested bias by changing one detail in a case and checking if the prediction changed. I like this kind of test because anyone can run it on a system they don't control, including regulators and journalists."

